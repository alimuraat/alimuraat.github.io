name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels a queued older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Fails the build rather than shipping a page the CSP would break, or a
      # deploy that quietly lost the dot-directories.
      - name: Assert build output
        run: |
          if grep -rlE '<script type="module">|<style' dist --include='*.html'; then
            echo "inline script/style found in dist — see README > CSP"
            exit 1
          fi
          test -f dist/.well-known/security.txt || { echo "security.txt missing"; exit 1; }

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # Without this the action tars with --exclude=.[^/]*, which silently
          # drops .well-known/ and .nojekyll from the deploy.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
